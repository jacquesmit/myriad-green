<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You for Your Order! | Myriad Green</title>
  <meta name="description" content="Thank you for your order! Your purchase has been confirmed and we'll process it shortly.">
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  
  <!-- Core Styles -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/thank-you-order.css">
</head>
<body data-theme="light">
  <canvas id="fireworkCanvas"></canvas>
  
  <section class="thank-you-order-section">
    <div class="thank-you-order-container">
      <!-- Success Icon -->
      <div class="success-icon">
        <div class="success-circle">
          <i class="fas fa-shopping-bag"></i>
        </div>
      </div>
      
      <!-- Main Content -->
      <h1 class="thank-you-title">Thank You for Your Order!</h1>
      <p class="thank-you-message">Your order has been successfully placed. We'll send you a confirmation email shortly with your order details.</p>
      
      <!-- Order Summary -->
      <div class="order-summary">
        <h3 class="order-summary__title">
          <i class="fas fa-receipt"></i>
          Order Summary
        </h3>
        <div class="order-summary__content">
          <ul id="orderSummaryList" class="order-items"></ul>
          <div class="order-total" id="orderTotal"></div>
        </div>
      </div>
      
      <!-- Action Buttons -->
      <div class="action-buttons">
        <a href="shop/index.html" class="btn btn-secondary">
          <i class="fas fa-shopping-cart"></i>
          Continue Shopping
        </a>
        <a href="index.html" class="btn btn-primary">
          <i class="fas fa-home"></i>
          Return to Home
        </a>
      </div>
      
      <!-- Auto Redirect Notice -->
      <p class="redirect-notice" id="countdown">
        <i class="fas fa-info-circle"></i>
        Redirecting to homepage in <span id="countdownSeconds">8</span> seconds
      </p>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script src="js/order-confirmation.js"></script>

  <script>
    const canvas = document.getElementById('fireworkCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];

    function createFirework(x, y) {
      const colors = ["#ff5252", "#ffa000", "#7c4dff", "#00e676", "#40c4ff"];
      for (let i = 0; i < 80; i++) {
        particles.push({
          x,
          y,
          radius: Math.random() * 2 + 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          angle: Math.random() * 2 * Math.PI,
          speed: Math.random() * 4 + 1,
          alpha: 1
        });
      }
    }

    function hexToRgb(hex) {
      const bigint = parseInt(hex.replace("#", ""), 16);
      return `${(bigint >> 16) & 255},${(bigint >> 8) & 255},${bigint & 255}`;
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        p.alpha -= 0.008;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
        ctx.fillStyle = `rgba(${hexToRgb(p.color)}, ${p.alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(animate);
    }

    // Fireworks loop
    let bursts = 0;
    const fireInterval = setInterval(() => {
      createFirework(
        Math.random() * window.innerWidth,
        Math.random() * window.innerHeight / 2
      );
      bursts++;
      if (bursts >= 7) clearInterval(fireInterval);
    }, 800);

    animate();

    // Countdown and Redirect
    let seconds = 8;
    const countdownSecondsEl = document.getElementById('countdownSeconds');
    const interval = setInterval(() => {
      seconds--;
      if (countdownSecondsEl) countdownSecondsEl.textContent = seconds;
      if (seconds <= 0) clearInterval(interval);
    }, 1000);

    setTimeout(() => {
      canvas.style.transition = "opacity 1s ease";
      canvas.style.opacity = 0;

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1000);
    }, 8000);
  </script>

  <script>
  const urlParams = new URLSearchParams(window.location.search);
  const sessionId = urlParams.get('sessionId');
  const orderId = urlParams.get('orderId');
  // server will store emailSent in Firestore; we use that to decide client fallback
  // Detect backend API base: if not on port 3000 locally, point to http://localhost:3000
  const detectApiBase = () => {
    const { hostname, port, protocol } = window.location;
    const isLocal = (hostname === 'localhost' || hostname === '127.0.0.1' || /^192\.168\./.test(hostname) || /^10\./.test(hostname) || /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(hostname));
    if (isLocal && port !== '3000') return 'http://localhost:3000';
    return `${protocol}//${hostname}${port ? ':' + port : ''}`;
  };
  const API_BASE = detectApiBase();

  // Prefer sessionId for fetching; fall back to orderId if present
  const lookupId = sessionId || orderId;
  if (!lookupId) {
    document.getElementById('orderSummaryList').innerHTML = '<li>❌ Missing order identifier in URL.</li>';
  } else {
  fetch(`${API_BASE}/order/${encodeURIComponent(lookupId)}`)
      .then(response => {
        if (!response.ok) {
          throw new Error('Failed to fetch order');
        }
        return response.json();
      })
      .then(order => {
        const list = document.getElementById("orderSummaryList");
        const totalEl = document.getElementById("orderTotal");
        let total = 0;
        list.innerHTML = ""; // Clear list

        (order.cart || []).forEach((item, i) => {
          const li = document.createElement("li");
          li.className = 'order-item';
          li.innerHTML = `
            <div class="order-item__info">
              <span class="order-item__quantity">${item.quantity}×</span>
              <span class="order-item__name">${item.name}</span>
            </div>
            <span class="order-item__price">R${(item.price * item.quantity).toFixed(2)}</span>
          `;
          li.style.animationDelay = `${0.3 + i * 0.3}s`;
          list.appendChild(li);
          total += item.price * item.quantity;
        });

        totalEl.innerHTML = `
          <span class="order-total__label">
            <i class="fas fa-receipt"></i>
            Total Paid:
          </span>
          <span class="order-total__amount">R${total.toFixed(2)}</span>
        `;

  // If server did not send the confirmation email (emailSent !== true), send it client-side using fetched details
  if (order.emailSent !== true && window.sendOrderConfirmationEmail) {
          try {
            window.sendOrderConfirmationEmail(
              order.cart || [],
              { name: order.customerName, email: order.customerEmail, phone: order.customerPhone },
              total
            );
          } catch (e) { /* non-fatal */ }
        }

        // Clean up local cart data
        try { localStorage.removeItem('cart'); localStorage.removeItem('lastOrder'); } catch {}
      })
      .catch(error => {
        console.error('Error fetching order details:', error);
        document.getElementById("orderSummaryList").innerHTML = '<li>❌ Failed to load order details.</li>';
      });
  }

  // Fallback behavior: Display error messages if orderId is missing or fetch fails.
  </script>
</body>
</html>
