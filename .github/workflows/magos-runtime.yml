      - 'magos/tests/signed-acceptance-verification.test.js'
      - 'magos/tests/operator-*.test.js'
      - 'magos/tests/runtime-http.test.js'
      - 'magos/tests/supplier-email-intake.test.js'
      - 'magos/package.json'
      - 'magos/Dockerfile'
      - '.github/workflows/magos-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: magos/package.json
      - run: npm install --no-audit --no-fund
      - run: node --check app.js
      - name: HostAfrica controlled release regression tests
        run: node --test tests/hostafrica-release.test.js
      - name: Whole MAGOS acceptance evaluator regression tests
        run: node --test tests/whole-system-acceptance.test.js
      - name: Hosted app.js entrypoint smoke
        run: |
          export PORT=18081
          export MAGOS_RUNTIME_TOKEN=ci-hosted-entrypoint-token
          node app.js >/tmp/magos-hosted-entrypoint.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:18081/healthz
          curl --fail http://127.0.0.1:18081/readyz
      - run: node --test tests/runtime-http.test.js tests/transaction-writer.test.js tests/fluent-forms-adapter.test.js tests/supplier-email-intake.test.js tests/processor-registry.test.js tests/agent-router.test.js tests/agent-owner-resolver.test.js tests/agent-approval-policy.test.js tests/live-agent-authority.test.js tests/agent-review-queue.test.js tests/workflow-runner.test.js tests/operator-snapshot.test.js tests/operator-dashboard.test.js tests/operator-page.test.js tests/system-coverage.test.js tests/job-release-inspection.test.js tests/deposit-evidence-inspection.test.js tests/job-activation-assessment.test.js tests/signed-acceptance-verification.test.js tests/accepted-job-execution.test.js tests/accepted-quote-job-plan.test.js tests/canonical-job-authority.test.js tests/job-commit-readback.test.js tests/live-supplier-procurement.test.js tests/procurement-draft-transaction.test.js tests/procurement-issue-approval.test.js tests/quote-to-job-readiness.test.js tests/scoped-action-gate.test.js tests/supplier-approval-governance.test.js tests/supplier-approval-writer-integration.test.js tests/supplier-procurement-readiness.test.js tests/procurement-p3-integration.test.js tests/procurement-draft-http.test.js tests/job-closeout-readiness.test.js tests/supplier-approval-http-authority.test.js tests/scheduling-readiness.test.js tests/receivables-reconciliation.test.js tests/aftercare-readiness.test.js tests/service-history-verifier.test.js tests/finance-aftercare-http.test.js tests/operational-closure.test.js tests/release-preflight.test.js tests/wordpress-acceptance-verifier.test.js tests/accept-reviewed-quote.test.js tests/record-direct-job-cost.test.js tests/provisional-job-cost.test.js tests/verify-provisional-cost.test.js tests/supplier-cost-evidence.test.js tests/job-supplier-cost-queue.test.js tests/signed-quote-link.test.js

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -f magos/Dockerfile -t magos-runtime:p2 .
      - name: Start runtime
        run: docker run -d --name magos-runtime -p 8080:8080 -e MAGOS_RUNTIME_TOKEN=ci-only-token magos-runtime:p2
      - name: Health and readiness
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/readyz
      - name: Stop runtime
        if: always()
        run: docker rm -f magos-runtime || true
