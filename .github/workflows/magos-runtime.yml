name: MAGOS Runtime P2

on:
  pull_request:
    paths:
      - 'magos/**'
      - '.github/workflows/magos-*.yml'
      - '.github/workflows/magos-*.yaml'
  push:
    branches:
      - main
    paths:
      - 'magos/**'
      - '.github/workflows/magos-*.yml'
      - '.github/workflows/magos-*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: magos/package.json
      - run: npm install --no-audit --no-fund
      - run: node --check app.js
      - name: HostAfrica controlled release regression tests
        run: node --test tests/hostafrica-release.test.js
      - name: Whole MAGOS acceptance evaluator regression tests
        run: node --test tests/whole-system-acceptance.test.js
      - name: Hosted app.js entrypoint smoke
        run: |
          export PORT=18081
          export MAGOS_RUNTIME_TOKEN=ci-hosted-entrypoint-token
          node app.js >/tmp/magos-hosted-entrypoint.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:18081/healthz
          curl --fail http://127.0.0.1:18081/readyz
      - name: Complete sequential MAGOS regression suite
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-reporter=tap tests/*.test.js | tee "$RUNNER_TEMP/magos-regression.tap"
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: magos-regression-${{ github.sha }}
          path: ${{ runner.temp }}/magos-regression.tap
          if-no-files-found: warn
          retention-days: 14

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build runtime image
        run: docker build -f magos/Dockerfile -t magos-runtime:p2 .
      - name: Start runtime
        run: docker run -d --name magos-runtime -p 8080:8080 -e MAGOS_RUNTIME_TOKEN=ci-only-token magos-runtime:p2
      - name: Health and readiness
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/readyz
      - name: Stop runtime
        if: always()
        run: docker rm -f magos-runtime || true
