      - 'magos/tests/signed-quote-link.test.js'
      - 'magos/tests/job-closeout-readiness.test.js'
      - 'magos/tests/accepted-*.test.js'
      - 'magos/tests/canonical-job-authority.test.js'
      - 'magos/tests/job-commit-readback.test.js'
