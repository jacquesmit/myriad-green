name: MAGOS Runtime P2

on:
  pull_request:
    paths:
      - 'magos/runtime/**'
      - 'magos/app.js'
      - 'magos/writer/**'
      - 'magos/adapters/**'
      - 'magos/processor/**'
      - 'magos/tests/runtime-http.test.js'
      - 'magos/tests/supplier-email-intake.test.js'
      - 'magos/package.json'
      - 'magos/Dockerfile'
      - '.github/workflows/magos-runtime.yml'
  push:
    branches:
      - main
    paths:
      - 'magos/runtime/**'
      - 'magos/writer/**'
      - 'magos/adapters/**'
      - 'magos/processor/**'
      - 'magos/tests/runtime-http.test.js'
      - 'magos/tests/supplier-email-intake.test.js'
      - 'magos/package.json'
      - 'magos/Dockerfile'
      - '.github/workflows/magos-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: magos/package.json
      - run: npm install --no-audit --no-fund
      - run: node --check app.js
      - run: node --test tests/runtime-http.test.js tests/transaction-writer.test.js tests/fluent-forms-adapter.test.js tests/supplier-email-intake.test.js tests/processor-registry.test.js

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -f magos/Dockerfile -t magos-runtime:p2 .
      - name: Start runtime
        run: docker run -d --name magos-runtime -p 8080:8080 -e MAGOS_RUNTIME_TOKEN=ci-only-token magos-runtime:p2
      - name: Health and readiness
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/readyz
      - name: Stop runtime
        if: always()
        run: docker rm -f magos-runtime || true
