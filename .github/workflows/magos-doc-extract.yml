name: MAGOS Document Extract Tests

on:
  pull_request:
    paths:
      - 'magos/**'
      - '.github/workflows/magos-doc-extract.yml'
  push:
    branches:
      - main
    paths:
      - 'magos/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: magos/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
