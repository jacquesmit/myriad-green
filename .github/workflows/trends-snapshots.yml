name: Trends snapshots

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  push:
    branches:
      - main

jobs:
  fetch-and-inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install
        run: npm ci

      - name: Fetch trends snapshots (mock by default)
        env:
          USE_GOOGLE_TRENDS_API: ${{ secrets.USE_GOOGLE_TRENDS_API }}
        run: |
          node scripts/fetch-trends-snapshots.js

      - name: Inject snapshots into HTML
        run: node scripts/inject-trends-snapshots.js

      - name: Commit generated snapshots and HTML (optional)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends-snapshots services/*.html || true
          git commit -m "chore(trends): update snapshots [ci skip]" || echo "no changes to commit"
          git push origin HEAD:main || echo "push failed"
